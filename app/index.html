<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Search</title><style>body{font:17px system-ui;background:#f2f5fa;color:#172338;max-width:980px;margin:40px auto;padding:24px}main{background:white;padding:30px;border-radius:16px}input{font:inherit;padding:12px;width:70%}button{background:#2359c4;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:#eef2f8;padding:15px;margin:10px 0;border-radius:8px}small{color:#566}@media(max-width:650px){.columns{grid-template-columns:1fr}input{width:90%}}</style><main><h1>Document Search Benchmark</h1><p>Compare keyword search with a small latent semantic index. No chatbot or generated answers.</p><form id="form"><input id="query" value="worker crashed while processing task" required maxlength="1000" aria-label="Search query"><button>Compare</button></form><div class="columns"><section><h2>Keyword TF-IDF</h2><div id="keyword" aria-live="polite"></div></section><section><h2>Latent semantic analysis</h2><div id="latent" aria-live="polite"></div></section></div><small>Twenty authored demonstration documents. Scores are similarities, not probabilities.</small></main><script>function display(id,body){const target=document.getElementById(id);target.replaceChildren();if(!body.results){target.textContent=JSON.stringify(body);return}if(!body.results.length){target.textContent='No vocabulary match. Try another query.';return}for(const row of body.results){const card=document.createElement('article');const title=document.createElement('h3');title.textContent=row.title;const text=document.createElement('p');text.textContent=row.text;const score=document.createElement('small');score.textContent='Similarity: '+row.score;card.append(title,text,score);target.append(card)}}document.getElementById('form').onsubmit=async(e)=>{e.preventDefault();const q=document.getElementById('query').value;await Promise.all(['keyword','latent'].map(async(method)=>{try{const response=await fetch('/search?'+new URLSearchParams({q,method}));display(method,await response.json())}catch(error){document.getElementById(method).textContent='Cannot reach the local server.'}}))};</script></html>
